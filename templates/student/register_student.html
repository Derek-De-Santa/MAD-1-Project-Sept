{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white text-center py-3">
                <h4 class="mb-0">Student Registration</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('register_student') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Choose Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Choose Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mt-3">Register Account</button>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Login here.</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
