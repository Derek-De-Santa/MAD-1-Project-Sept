{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white text-center py-3">
                <h4 class="mb-0">Examiner Registration</h4>
                <small class="text-muted">Account requires Admin approval before access is granted.</small>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('register_examiner') }}" method="POST">
                    
                    <h6 class="mb-3 border-bottom pb-2">Account Details</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">Choose Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Choose Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>

                    <h6 class="mb-3 mt-3 border-bottom pb-2">Professional Details</h6>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label">Department</label>
                            <input type="text" class="form-control" id="department" name="department" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="contact_details" class="form-label">Contact Details (Email/Phone)</label>
                            <input type="text" class="form-control" id="contact_details" name="contact_details" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 mt-4">Submit Registration Request</button>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Login here.</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
