{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Courses</h2>
    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCourseModal">
        + Add New Course
    </button>
</div>

<div class="table-responsive bg-white shadow-sm p-3 rounded">
    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>Code</th>
                <th>Course Name</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>{{ course.course_code }}</td>
                <td>{{ course.course_name }}</td>
                <td><span class="badge bg-success">{{ course.status }}</span></td>
                <td>
                    <form action="{{ url_for('delete_course', course_id=course.course_id) }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this course?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center text-muted">No courses found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Add Course Modal -->
<div class="modal fade" id="addCourseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form action="{{ url_for('manage_courses') }}" method="POST">
          <div class="modal-header">
            <h5 class="modal-title">Create New Course</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
              <div class="mb-3">
                  <label class="form-label">Course Code</label>
                  <input type="text" name="course_code" class="form-control" required placeholder="e.g., CS101">
              </div>
              <div class="mb-3">
                  <label class="form-label">Course Name</label>
                  <input type="text" name="course_name" class="form-control" required placeholder="e.g., Intro to Programming">
              </div>
              <div class="mb-3">
                  <label class="form-label">Description</label>
                  <textarea name="description" class="form-control" rows="3"></textarea>
              </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Course</button>
          </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
