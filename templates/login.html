{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm mt-5">
            <div class="card-header bg-white text-center py-3">
                <h4 class="mb-0">System Login</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST">
                    <!-- HTML5 validation used via 'required' attribute -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <p class="mb-1">Don't have an account?</p>
                <a href="{{ url_for('register_student') }}" class="btn btn-sm btn-outline-secondary me-2">Register as Student</a>
                <a href="{{ url_for('register_examiner') }}" class="btn btn-sm btn-outline-secondary">Register as Examiner</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
